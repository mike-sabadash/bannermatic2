name: Deploy Bannermatic Production
# Production deployment for bannermatic.online
# Trigger production after SSH secret configuration
# deploy run 4

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bannermatic-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy secret exists
        run: |
          if [ -z "${{ secrets.BANNERMATIC_SERVER_SSH_KEY }}" ]; then
            echo "BANNERMATIC_SERVER_SSH_KEY is not configured" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BANNERMATIC_SERVER_SSH_KEY }}" > ~/.ssh/bannermatic_server
          chmod 600 ~/.ssh/bannermatic_server
          ssh-keyscan -p 2222 213.182.208.29 >> ~/.ssh/known_hosts

      - name: Backup current production
        run: |
          ssh -i ~/.ssh/bannermatic_server -p 2222 -o IdentitiesOnly=yes root@213.182.208.29 \
            'set -e; test -d /var/www/bannermatic; rm -rf /var/www/bannermatic-backup-ci; cp -a /var/www/bannermatic /var/www/bannermatic-backup-ci'

      - name: Deploy static build
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/bannermatic_server -p 2222 -o IdentitiesOnly=yes" \
            dist/ root@213.182.208.29:/var/www/bannermatic/

      - name: Install canonical portfolio host
        run: |
          cat >/tmp/bannermatic.online.conf <<'NGINX'
          server {
            listen 80;
            listen [::]:80;
            server_name bannermatic.online www.bannermatic.online;
            return 301 https://bannermatic.online$request_uri;
          }

          server {
            listen 443 ssl;
            listen [::]:443 ssl;
            server_name bannermatic.online;

            ssl_certificate /etc/letsencrypt/live/studio.bannermatic.online/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/studio.bannermatic.online/privkey.pem;
            include /etc/letsencrypt/options-ssl-nginx.conf;
            ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

            root /var/www/bannermatic;
            index index.html;
            location / {
              try_files $uri $uri/ /index.html;
            }
          }

          server {
            listen 443 ssl;
            listen [::]:443 ssl;
            server_name www.bannermatic.online;

            ssl_certificate /etc/letsencrypt/live/studio.bannermatic.online/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/studio.bannermatic.online/privkey.pem;
            include /etc/letsencrypt/options-ssl-nginx.conf;
            ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

            return 301 https://bannermatic.online$request_uri;
          }
          NGINX
          scp -i ~/.ssh/bannermatic_server -P 2222 -o IdentitiesOnly=yes /tmp/bannermatic.online.conf root@213.182.208.29:/etc/nginx/conf.d/bannermatic.online.conf
          ssh -i ~/.ssh/bannermatic_server -p 2222 -o IdentitiesOnly=yes root@213.182.208.29 \
            'rm -f /etc/nginx/sites-enabled/bannermatic-new-domains; nginx -t; systemctl reload nginx'

      - name: Verify production
        run: |
          ssh -i ~/.ssh/bannermatic_server -p 2222 -o IdentitiesOnly=yes root@213.182.208.29 'nginx -t'
          curl -fsSI --max-time 30 https://bannermatic.online/
          curl -fsS --max-time 30 https://bannermatic.online/ | grep -q '<div id="root"></div>'
          echo 'BANNERMATIC_PRODUCTION_OK'
