<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bannermatic turns campaign masters and media plans into animated, platform-ready banner systems across every format." />
    <meta name="theme-color" content="#111112" />
    <title>Bannermatic — Digital Campaign Production</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('bannermatic-theme')
        const isDark = savedTheme ? savedTheme === 'dark' : true
        document.documentElement.classList.toggle('dark', isDark)
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
      } catch (_) {}
    </script>
    <link rel="preload" as="image" href="/brand/suzuki.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/brand/toyota.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/brand/lada.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/brand/parimatch.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/brand/msi.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/brand/lime.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/projects/toyota-lc200-keyvisual.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
