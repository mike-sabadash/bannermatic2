 {art:&#x27;bearing&#x27;,title:&#x27;Подшипники&#x27;,s1:&#x27;Ведущие производители.&#x27;,s2:&#x27;Подбор аналога по маркировке&#x27;},
 {art:&#x27;belt&#x27;,title:&#x27;Резинотканевые ленты&#x27;,s1:&#x27;70 000 м² в наличии.&#x27;,s2:&#x27;Нестандартная ширина до 3 000 мм&#x27;}
];
const reduce=matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const NS=&#x27;http://www.w3.org/2000/svg&#x27;, E=&#x27;cubic-bezier(.22,1,.36,1)&#x27;;
const $=id=&gt;document.getElementById(id);
const easeOut=t=&gt;1-Math.pow(1-t,4), easeInOut=t=&gt;t&lt;.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2;
function el(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);parent&amp;&amp;parent.appendChild(n);return n;}

// сетка
const grid=$(&#x27;grid&#x27;), cols=$(&#x27;cols&#x27;);
for(let i=0;i&lt;13;i++){const l=document.createElement(&#x27;i&#x27;);l.style.left=(72+i*108)+&#x27;px&#x27;;grid.appendChild(l);
 if(i&lt;11){const s=document.createElement(&#x27;span&#x27;);s.textContent=&#x27;ABCDEFGHIJK&#x27;[i];s.style.left=(78+i*108)+&#x27;px&#x27;;cols.appendChild(s);}}
[112,195.5,279,362.5,446,529.5,613,696.5,780].forEach(y=&gt;{const b=document.createElement(&#x27;b&#x27;);b.style.top=y+&#x27;px&#x27;;grid.appendChild(b);});

// подшипник: кольца и тела качения (геометрия из макета)
const BC={x:1100,y:509};
const rings=[389.62,376.62,298.62,210.62,176.62,163.62].map(r=&gt;el(&#x27;circle&#x27;,{class:&#x27;ln&#x27;,cx:BC.x,cy:BC.y,r,pathLength:1},$(&#x27;rings&#x27;)));
const balls=[];
for(let k=0;k&lt;11;k++){const g=el(&#x27;g&#x27;,{},$(&#x27;balls&#x27;)); el(&#x27;circle&#x27;,{class:&#x27;ln&#x27;,cx:0,cy:0,r:43.62},g); balls.push(g);}
const BALL_R=255;

// лента на двух шкивах: ролики идут по средней линии ремня
const L={cx1:993,cx2:1493,cy:509,r:193.4}, STRAIGHT=L.cx2-L.cx1, ARC=Math.PI*L.r, LEN=2*STRAIGHT+2*ARC;
const NR=19, rollers=[];
for(let k=0;k&lt;NR;k++){const g=el(&#x27;g&#x27;,{},$(&#x27;rollers&#x27;)); el(&#x27;circle&#x27;,{class:&#x27;ln&#x27;,cx:0,cy:0,r:47.12},g); rollers.push(g);}
function onTrack(s){s=((s%LEN)+LEN)%LEN;
 if(s&lt;STRAIGHT) return [L.cx1+s,L.cy-L.r];
 s-=STRAIGHT; if(s&lt;ARC){const a=-Math.PI/2+s/L.r; return [L.cx2+L.r*Math.cos(a),L.cy+L.r*Math.sin(a)];}
 s-=ARC; if(s&lt;STRAIGHT) return [L.cx2-s,L.cy+L.r];
 s-=STRAIGHT; const a=Math.PI/2+s/L.r; return [L.cx1+L.r*Math.cos(a),L.cy+L.r*Math.sin(a)];}

// твины для SVG-атрибутов
function tween(dur,delay,ease,fn){return new Promise(res=&gt;{if(reduce){fn(1);res();return;}const t0=performance.now()+delay;
 const step=t=&gt;{const p=Math.max(0,Math.min(1,(t-t0)/dur));fn(ease(p));p&lt;1?requestAnimationFrame(step):res();};requestAnimationFrame(step);});}

// видео в масках: CSS clip-path в координатах сцены
const vBearing=$(&#x27;vBearing&#x27;), vBelt=$(&#x27;vBelt&#x27;), vB=vBearing.querySelector(&#x27;video&#x27;), vL=vBelt.querySelector(&#x27;video&#x27;);
const clip={bearingR:0,beltC:0,beltH:0};
function clipBearing(){vBearing.style.clipPath=&#x27;circle(&#x27;+clip.bearingR.toFixed(2)+&#x27;px at 1099.5px 508.5px)&#x27;;}
function circlePath(cx,cy,r){return &#x27;M&#x27;+(cx-r)+&#x27; &#x27;+cy+&#x27;a&#x27;+r+&#x27; &#x27;+r+&#x27; 0 1 0 &#x27;+(2*r)+&#x27; 0a&#x27;+r+&#x27; &#x27;+r+&#x27; 0 1 0 &#x27;+(-2*r)+&#x27; 0Z&#x27;;}
function clipBelt(){const r=clip.beltC, h=clip.beltH, rr=h/2, x1=1124, x2=1644, y0=509-rr, y1=509+rr;
 let d=r&gt;0.5?circlePath(993,509,r):&#x27;&#x27;;
 if(h&gt;0.5) d+=&#x27;M&#x27;+(x1+rr)+&#x27; &#x27;+y0+&#x27;H&#x27;+(x2-rr)+&#x27;A&#x27;+rr+&#x27; &#x27;+rr+&#x27; 0 0 1 &#x27;+(x2-rr)+&#x27; &#x27;+y1+&#x27;H&#x27;+(x1+rr)+&#x27;A&#x27;+rr+&#x27; &#x27;+rr+&#x27; 0 0 1 &#x27;+(x1+rr)+&#x27; &#x27;+y0+&#x27;Z&#x27;;
 vBelt.style.clipPath=d?&quot;path(&#x27;&quot;+d+&quot;&#x27;)&quot;:&#x27;circle(0px at 0 0)&#x27;;}
const vids={bearing:[vBearing,vB],belt:[vBelt,vL]};

// постоянное движение: подшипник вращается, ролики едут по ленте
const state={ballAppear:Array(11).fill(0),rollerAppear:Array(NR).fill(0),photoDrift:0};
let spin=0, travel=0, last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000); last=t;
 if(!reduce){spin+=dt*9; travel+=dt*34;}
 balls.forEach((g,k)=&gt;{const a=(-90+k*360/11+spin)*Math.PI/180, s=state.ballAppear[k];
  g.setAttribute(&#x27;transform&#x27;,&#x27;translate(&#x27;+(BC.x+BALL_R*Math.cos(a)).toFixed(2)+&#x27; &#x27;+(BC.y+BALL_R*Math.sin(a)).toFixed(2)+&#x27;) scale(&#x27;+s.toFixed(3)+&#x27;)&#x27;); g.style.opacity=s;});
 rollers.forEach((g,k)=&gt;{const p=onTrack(travel+k*LEN/NR), s=state.rollerAppear[k];
  g.setAttribute(&#x27;transform&#x27;,&#x27;translate(&#x27;+p[0].toFixed(2)+&#x27; &#x27;+p[1].toFixed(2)+&#x27;) scale(&#x27;+s.toFixed(3)+&#x27;)&#x27;); g.style.opacity=s;});
 const z=1.04+0.04*Math.sin(t/2600);
 vB.style.transform=&#x27;scale(&#x27;+z.toFixed(4)+&#x27;)&#x27;;
 vL.style.transform=&#x27;translateX(&#x27;+(-18*Math.sin(t/3800)-state.photoDrift).toFixed(2)+&#x27;px)&#x27;;
 clipBearing(); clipBelt();
 requestAnimationFrame(loop);}
requestAnimationFrame(loop);

// появление и уход иллюстраций
const groups={bearing:$(&#x27;bearing&#x27;),belt:$(&#x27;belt&#x27;)};
function drawStroke(node,dur,delay){node.style.strokeDasharray=&#x27;1&#x27;;node.style.strokeDashoffset=&#x27;1&#x27;;return tween(dur,delay,easeInOut,p=&gt;node.style.strokeDashoffset=String(1-p));}
function enterArt(key,first){const g=groups[key]; g.setAttribute(&#x27;opacity&#x27;,1); const [vw,vv]=vids[key]; vw.style.opacity=1; try{vv.currentTime=key===&#x27;belt&#x27;?16:0;}catch(e){} const pp=vv.play(); pp&amp;&amp;pp.catch(()=&gt;{}); const d=first?500:180;
 if(key===&#x27;bearing&#x27;){
  rings.forEach((r,i)=&gt;drawStroke(r,1400,d+i*70));
  state.ballAppear.fill(0); for(let k=0;k&lt;11;k++) tween(700,d+500+k*55,easeOut,p=&gt;state.ballAppear[k]=p);
  clip.bearingR=0; tween(1100,d+650,easeOut,p=&gt;clip.bearingR=155.5*p);
 } else {
  drawStroke($(&#x27;beltOuter&#x27;),1500,d); drawStroke($(&#x27;beltInner&#x27;),1500,d+150);
  state.rollerAppear.fill(0); for(let k=0;k&lt;NR;k++) tween(650,d+450+k*40,easeOut,p=&gt;state.rollerAppear[k]=p);
  clip.beltC=0; clip.beltH=0; tween(950,d+650,easeOut,p=&gt;clip.beltC=112*p);
  tween(1100,d+820,easeOut,p=&gt;clip.beltH=224*p);
  tween(2200,d+650,easeOut,p=&gt;state.photoDrift=-40*(1-p));
 }}
function leaveArt(key){const g=groups[key], [vw,vv]=vids[key];
 const done=()=&gt;{vv.pause();}; if(reduce){g.setAttribute(&#x27;opacity&#x27;,0);vw.style.opacity=0;done();return;}
 tween(420,0,t=&gt;t,p=&gt;{g.setAttribute(&#x27;opacity&#x27;,(1-p).toFixed(3));vw.style.opacity=(1-p).toFixed(3);}).then(()=&gt;{ if(SLIDES[current].art!==key) done(); });}

// текст: строки уезжают вверх и въезжают снизу
function swapLine(node,text,delay){ if(reduce){node.textContent=text;return;}
 node.animate([{transform:&#x27;translateY(0)&#x27;,opacity:1},{transform:&#x27;translateY(-40%)&#x27;,opacity:0}],{duration:220,easing:&#x27;ease-in&#x27;,fill:&#x27;forwards&#x27;}).onfinish=()=&gt;{
  node.textContent=text; node.animate([{transform:&#x27;translateY(105%)&#x27;,opacity:0},{transform:&#x27;translateY(0)&#x27;,opacity:1}],{duration:620,delay,easing:E,fill:&#x27;forwards&#x27;});};}
function riseLine(node,text,delay){node.textContent=text; if(reduce) return;
 node.animate([{transform:&#x27;translateY(105%)&#x27;,opacity:0},{transform:&#x27;translateY(0)&#x27;,opacity:1}],{duration:900,delay,easing:E,fill:&#x27;backwards&#x27;});}
// прогресс автосмены: красная ветвь ленты заполняет отрезок текущего слайда за 7 секунд
const AUTO=7000, BAR_W=228, pad=n=&gt;String(n).padStart(2,&#x27;0&#x27;);
const countText=i=&gt;pad(i+1)+&#x27; / &#x27;+pad(SLIDES.length);
const nextText=i=&gt;&#x27;Далее: &#x27;+SLIDES[(i+1)%SLIDES.length].title;
let prog=null, hover=false;
function runProgress(delay){ if(prog) prog.cancel(); const N=SLIDES.length, a=current/N*BAR_W, b=(current+1)/N*BAR_W;
 prog=$(&#x27;bar&#x27;).animate([{width:a+&#x27;px&#x27;},{width:b+&#x27;px&#x27;}],{duration:AUTO,delay:delay||0,easing:&#x27;linear&#x27;,fill:&#x27;both&#x27;});
 if(hover||document.hidden) prog.pause();
 prog.onfinish=()=&gt;step(1);}

let current=0, busy=false;
function show(i,first){const s=SLIDES[i];
 if(first){riseLine($(&#x27;title&#x27;),s.title,350);riseLine($(&#x27;sub1&#x27;),s.s1,470);riseLine($(&#x27;sub2&#x27;),s.s2,560);riseLine($(&#x27;nextLabel&#x27;),nextText(i),900);riseLine($(&#x27;counter&#x27;),countText(i),950);runProgress(1000);enterArt(s.art,true);return;}
 swapLine($(&#x27;title&#x27;),s.title,0); swapLine($(&#x27;sub1&#x27;),s.s1,80); swapLine($(&#x27;sub2&#x27;),s.s2,140); swapLine($(&#x27;nextLabel&#x27;),nextText(i),180); swapLine($(&#x27;counter&#x27;),countText(i),200);
 runProgress(0);}
function goTo(i){ if(busy||i===current) return; busy=true; const prev=SLIDES[current].art; current=i;
 leaveArt(prev); show(i,false); enterArt(SLIDES[i].art,false); setTimeout(()=&gt;busy=false,900);}
const step=d=&gt;goTo((current+d+SLIDES.length)%SLIDES.length);
$(&#x27;next&#x27;).onclick=()=&gt;step(1); $(&#x27;prev&#x27;).onclick=()=&gt;step(-1);
addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key===&#x27;ArrowRight&#x27;)step(1); if(e.key===&#x27;ArrowLeft&#x27;)step(-1);});

// автосмена: пауза при наведении и в фоновой вкладке, полоска при этом останавливается
const stage=$(&#x27;stage&#x27;);
stage.addEventListener(&#x27;mouseenter&#x27;,()=&gt;{hover=true; prog&amp;&amp;prog.pause();});
stage.addEventListener(&#x27;mouseleave&#x27;,()=&gt;{hover=false; if(!document.hidden) prog&amp;&amp;prog.play();});
document.addEventListener(&#x27;visibilitychange&#x27;,()=&gt;{ if(!prog) return; document.hidden||hover?prog.pause():prog.play();});

// вписать 1440 в окно
function fit(){const s=Math.min(1,innerWidth/1440); stage.style.transform=&#x27;scale(&#x27;+s+&#x27;)&#x27;; document.body.style.height=(900*s)+&#x27;px&#x27;;}
addEventListener(&#x27;resize&#x27;,fit); fit();

// первый показ
document.querySelectorAll(&#x27;.intro&#x27;).forEach((n,i)=&gt;{ if(reduce){n.style.opacity=1;return;}
 n.animate([{opacity:0,transform:&#x27;translateY(8px)&#x27;},{opacity:1,transform:&#x27;none&#x27;}],{duration:700,delay:80+i*45,easing:E,fill:&#x27;forwards&#x27;});});
if(!reduce) grid.animate([{opacity:0},{opacity:1}],{duration:900,easing:&#x27;ease-out&#x27;});
show(0,true);
&lt;/script&gt;
&lt;/body&gt;

<script>
const browser=document.querySelector('.browser'), viewport=document.querySelector('.viewport'), frame=document.querySelector('iframe'), full=document.querySelector('#fullscreen');
const original=frame.srcdoc;
function fit(){
 const availableWidth=browser.clientWidth-16;
 const availableHeight=document.fullscreenElement?browser.clientHeight-60:innerHeight-browser.getBoundingClientRect().top-80;
 const scale=Math.min(availableWidth/1440,Math.max(260,availableHeight)/900,1);
 viewport.style.width=1440*scale+'px'; viewport.style.height=900*scale+'px';frame.style.transform='scale('+scale+')';
}
new ResizeObserver(fit).observe(document.querySelector('.wrap'),{box:'border-box'});
window.addEventListener('resize',fit);
document.querySelector('#replay').onclick=()=>{frame.srcdoc=original;};
full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await browser.requestFullscreen();}catch{document.querySelector('.status').textContent='Fullscreen is unavailable in this viewer.';}};
document.addEventListener('fullscreenchange',()=>{const active=Boolean(document.fullscreenElement);full.setAttribute('aria-pressed',active);full.title=active?'Exit fullscreen':'Fullscreen';full.setAttribute('aria-label',full.title);fit();});
fit();
</script>
