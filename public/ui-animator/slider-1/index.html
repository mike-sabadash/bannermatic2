&lt;script&gt;
const stage=document.getElementById(&#x27;stage&#x27;);
function fit(){const s=Math.min(1,innerWidth/1440);stage.style.transform=s&lt;1?&#x27;scale(&#x27;+s+&#x27;)&#x27;:&#x27;&#x27;;}
addEventListener(&#x27;resize&#x27;,fit);fit();

// grid
const grid=document.getElementById(&#x27;grid&#x27;);const V=[],H=[],L=[];
for(let k=0;k&lt;13;k++){const d=document.createElement(&#x27;div&#x27;);d.className=&#x27;gv&#x27;;d.style.left=(72+108*k)+&#x27;px&#x27;;grid.appendChild(d);V.push(d);}
[112,196,279,363,446,530,613,697,780].forEach(y=&gt;{const d=document.createElement(&#x27;div&#x27;);d.className=&#x27;gh&#x27;;d.style.top=y+&#x27;px&#x27;;grid.appendChild(d);H.push(d);});
&#x27;ABCDEFGHIJK&#x27;.split(&#x27;&#x27;).forEach((c,k)=&gt;{const d=document.createElement(&#x27;div&#x27;);d.className=&#x27;a col&#x27;;d.textContent=c;d.style.left=(78+108*k)+&#x27;px&#x27;;grid.appendChild(d);L.push(d);});

const reduce=matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const E=&#x27;cubic-bezier(.2,.7,.1,1)&#x27;, EO=&#x27;cubic-bezier(.16,1,.3,1)&#x27;;
const q=s=&gt;document.querySelector(s), qa=s=&gt;[...document.querySelectorAll(s)];
function anim(el,kf,o){return el.animate(kf,Object.assign({fill:&#x27;both&#x27;,easing:E},o));}
const fadeUp=(el,delay,dy=14,dur=800)=&gt;anim(el,[{opacity:0,transform:&#x27;translateY(&#x27;+dy+&#x27;px)&#x27;},{opacity:1,transform:&#x27;none&#x27;}],{duration:dur,delay});

function intro(){
  document.body.classList.remove(&#x27;js&#x27;);
  if(reduce){q(&#x27;#sweep&#x27;).setAttribute(&#x27;stroke-dashoffset&#x27;,&#x27;0&#x27;);q(&#x27;#outline&#x27;).style.strokeDashoffset=&#x27;0&#x27;;q(&#x27;#tail&#x27;).setAttribute(&#x27;width&#x27;,&#x27;700&#x27;);return;}
  // grid draws
  V.forEach((d,i)=&gt;anim(d,[{transform:&#x27;scaleY(0)&#x27;},{transform:&#x27;scaleY(1)&#x27;}],{duration:1100,delay:i*35,easing:EO}));
  H.forEach((d,i)=&gt;anim(d,[{transform:&#x27;scaleX(0)&#x27;},{transform:&#x27;scaleX(1)&#x27;}],{duration:1300,delay:120+i*45,easing:EO}));
  L.forEach((d,i)=&gt;anim(d,[{opacity:0},{opacity:1}],{duration:500,delay:400+i*40}));
  // header
  qa(&#x27;.nav,.phone,.msg&#x27;).forEach((el,i)=&gt;fadeUp(el,100+i*60,-8,700));
  qa(&#x27;.logo,.cat,.search,.login,.cart&#x27;).forEach((el,i)=&gt;fadeUp(el,180+i*70,-8,700));
  // copy
  fadeUp(q(&#x27;.label&#x27;),450,10);
  qa(&#x27;.h1 .ln span&#x27;).forEach((el,i)=&gt;anim(el,[{transform:&#x27;translateY(105%)&#x27;},{transform:&#x27;none&#x27;}],{duration:1000,delay:520+i*110,easing:EO}));
  fadeUp(q(&#x27;.num&#x27;),900,18,900);
  anim(q(&#x27;#plus&#x27;),[{transform:&#x27;scale(.2) rotate(-90deg)&#x27;,opacity:0},{transform:&#x27;none&#x27;,opacity:1}],{duration:700,delay:2350,easing:&#x27;cubic-bezier(.34,1.56,.64,1)&#x27;});
  countUp(q(&#x27;#n&#x27;),100000,1500,950);
  fadeUp(q(&#x27;.cap&#x27;),1100,10);
  fadeUp(q(&#x27;.about&#x27;),1200,10);
  qa(&#x27;.next,.belt,.count,.prev,.fwd&#x27;).forEach((el,i)=&gt;fadeUp(el,1300+i*60,10,700));
  anim(q(&#x27;#prog&#x27;),[{transform:&#x27;scaleX(0)&#x27;},{transform:&#x27;scaleX(1)&#x27;}],{duration:1400,delay:1600,easing:EO});
  // mark: outline draws, photo sweeps along the ring, then runs out along the belt
  anim(q(&#x27;#outline&#x27;),[{strokeDashoffset:1},{strokeDashoffset:0}],{duration:2600,delay:200,easing:&#x27;cubic-bezier(.45,0,.2,1)&#x27;});
  anim(q(&#x27;#sweep&#x27;),[{strokeDashoffset:1},{strokeDashoffset:0}],{duration:1500,delay:450,easing:&#x27;cubic-bezier(.55,0,.25,1)&#x27;});
  T0=performance.now();
}

function countUp(el,to,dur,delay){
  const fmt=v=&gt;String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g,&#x27; &#x27;);
  el.style.fontFeatureSettings=&#x27;&quot;tnum&quot;&#x27;;el.textContent=&#x27;0&#x27;;const t0=performance.now()+delay;
  (function f(t){const p=Math.min(1,Math.max(0,(t-t0)/dur));const e=1-Math.pow(1-p,4);el.textContent=fmt(to*e);if(p&lt;1)requestAnimationFrame(f);else el.style.fontFeatureSettings=&#x27;&#x27;;})(t0);
}

// time-driven parts of the intro + gentle parallax afterwards
let T0=null,px=0,py=0,tx=0,ty=0;
stage.addEventListener(&#x27;pointermove&#x27;,e=&gt;{const r=stage.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5);ty=((e.clientY-r.top)/r.height-.5);});
stage.addEventListener(&#x27;pointerleave&#x27;,()=&gt;{tx=0;ty=0;});
const photo=q(&#x27;#photo&#x27;),og=q(&#x27;#outlineG&#x27;),spin=q(&#x27;#spin&#x27;),tail=q(&#x27;#tail&#x27;);
const vfo=q(&#x27;#vfo&#x27;),vid=q(&#x27;#vid&#x27;);
vid.addEventListener(&#x27;playing&#x27;,()=&gt;{vid.style.opacity=&#x27;1&#x27;;},{once:true});
const tryPlay=()=&gt;{const p=vid.play();if(p&amp;&amp;p.catch)p.catch(()=&gt;{});};tryPlay();
document.addEventListener(&#x27;visibilitychange&#x27;,()=&gt;{document.hidden?vid.pause():tryPlay();});
const eo=p=&gt;p&gt;=1?1:1-Math.pow(2,-10*p), seg=(t,d,dur)=&gt;Math.min(1,Math.max(0,(t-d)/dur));
function loop(now){
  if(T0!==null){const t=now-T0;
    const r=eo(seg(t,300,2000));            // settle rotation
    spin.setAttribute(&#x27;transform&#x27;,&#x27;translate(&#x27;+(40*(1-r)).toFixed(2)+&#x27; 0) rotate(&#x27;+(-6*(1-r)).toFixed(3)+&#x27; 297.88 281.4)&#x27;);
    tail.setAttribute(&#x27;width&#x27;,(700*eo(seg(t,1150,1100))).toFixed(1));
    var z=1+0.12*(1-eo(seg(t,300,3200)));    // photo zoom-out
  } else var z=1;
  px+=(tx-px)*.06;py+=(ty-py)*.06;
  const w=1054*z,h=597*z, cx=340-px*14, cy=290-py*10;
  photo.setAttribute(&#x27;width&#x27;,w.toFixed(2));photo.setAttribute(&#x27;height&#x27;,h.toFixed(2));
  photo.setAttribute(&#x27;x&#x27;,(cx-(340+186.4)*z).toFixed(2));photo.setAttribute(&#x27;y&#x27;,(cy-(290+9.2)*z).toFixed(2));
  const vw=990*z,vh=610*z;vfo.setAttribute(&#x27;width&#x27;,vw.toFixed(2));vfo.setAttribute(&#x27;height&#x27;,vh.toFixed(2));
  vfo.setAttribute(&#x27;x&#x27;,(cx-(340+31)*z).toFixed(2));vfo.setAttribute(&#x27;y&#x27;,(cy-(290+15.5)*z).toFixed(2));
  og.setAttribute(&#x27;transform&#x27;,&#x27;translate(&#x27;+(919.86+px*10).toFixed(2)+&#x27; &#x27;+(146+py*8).toFixed(2)+&#x27;) scale(1.3077913430048145)&#x27;);
  requestAnimationFrame(loop);}
if(!reduce)requestAnimationFrame(loop);

(document.fonts&amp;&amp;document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=&gt;setTimeout(r,1500))]):Promise.resolve()).then(intro);
&lt;/script&gt;
&lt;/body&gt;

<script>
const browser=document.querySelector('.browser'), viewport=document.querySelector('.viewport'), frame=document.querySelector('iframe'), full=document.querySelector('#fullscreen');

function fit(){
 const availableWidth=browser.clientWidth-16;
 const availableHeight=document.fullscreenElement?browser.clientHeight-60:innerHeight-browser.getBoundingClientRect().top-80;
 const scale=Math.min(availableWidth/1440,Math.max(260,availableHeight)/900,1);
 viewport.style.width=1440*scale+'px'; viewport.style.height=900*scale+'px';frame.style.transform='scale('+scale+')';
}

window.addEventListener('resize',fit);
