<script>
const browser=document.querySelector('.browser'), viewport=document.querySelector('.viewport'), frame=document.querySelector('iframe'), full=document.querySelector('#fullscreen');
const original=frame.srcdoc;
function fit(){
 const availableWidth=browser.clientWidth-16;
 const availableHeight=document.fullscreenElement?browser.clientHeight-60:innerHeight-browser.getBoundingClientRect().top-80;
 const scale=Math.min(availableWidth/1440,Math.max(260,availableHeight)/900,1);
 viewport.style.width=1440*scale+'px'; viewport.style.height=900*scale+'px';frame.style.transform='scale('+scale+')';
}
new ResizeObserver(fit).observe(document.querySelector('.wrap'),{box:'border-box'});
window.addEventListener('resize',fit);
document.querySelector('#replay').onclick=()=>{frame.srcdoc=original;};
full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await browser.requestFullscreen();}catch{document.querySelector('.status').textContent='Fullscreen is unavailable in this viewer.';}};
document.addEventListener('fullscreenchange',()=>{const active=Boolean(document.fullscreenElement);full.setAttribute('aria-pressed',active);full.title=active?'Exit fullscreen':'Fullscreen';full.setAttribute('aria-label',full.title);fit();});
fit();
</script>
