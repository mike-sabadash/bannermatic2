const itemsEl=document.getElementById(&#x27;items&#x27;); const items=SLIDES.map((s,i)=&gt;{const d=document.createElement(&#x27;div&#x27;); d.className=&#x27;item&#x27;; d.tabIndex=0; d.setAttribute(&#x27;role&#x27;,&#x27;button&#x27;); d.setAttribute(&#x27;aria-label&#x27;,&#x27;Слайд &#x27;+(i+1)+&#x27;: &#x27;+s.name);
 const n=String(i+1).padStart(2,&#x27;0&#x27;); d.innerHTML=&#x27;&lt;span class=&quot;name&quot;&gt;&#x27;+n+&#x27;&amp;nbsp;&amp;nbsp;&#x27;+s.name+&#x27;&lt;/span&gt;&lt;span class=&quot;num&quot;&gt;&#x27;+n+&#x27;&lt;/span&gt;&#x27;; d.addEventListener(&#x27;click&#x27;,()=&gt;goTo(i)); d.addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();goTo(i);}}); itemsEl.appendChild(d); return d;});

// пружина: stiffness 170, damping 18.5
let pos=0, vel=0, target=0, current=0, raf=null, last=0;
const wheel=document.getElementById(&#x27;wheel&#x27;);
function render(){
 wheel.setAttribute(&#x27;transform&#x27;,&#x27;rotate(&#x27;+(-pos*STEP)+&#x27; -211.4 450)&#x27;);
 items.forEach((el,i)=&gt;{let d=i-pos; d=((d%N)+N+N/2)%N-N/2; const ang=d*STEP; const a=Math.abs(d);
  el.style.transform=&#x27;rotate(&#x27;+ang+&#x27;deg)&#x27;;
  const morph=Math.min(1,a); // 0 = номер, 1 = название
  const num=el.querySelector(&#x27;.num&#x27;), name=el.querySelector(&#x27;.name&#x27;);
  num.style.opacity=Math.max(0,1-morph*1.6); num.style.transform=&#x27;translateX(378px) scale(&#x27;+(1-morph*0.35)+&#x27;)&#x27;;
  name.style.opacity=Math.max(0,Math.min(1,(morph-0.35)*1.8))*Math.max(0,Math.min(1,(1.6-a)*2));
  el.style.pointerEvents=a&gt;1.4?&#x27;none&#x27;:&#x27;auto&#x27;; el.style.visibility=a&gt;1.7?&#x27;hidden&#x27;:&#x27;visible&#x27;;});

function tick(t){const dt=Math.min(0.032,(t-last)/1000||0.016); last=t; const k=170,c=18.5; const f=-k*(pos-target)-c*vel; vel+=f*dt; pos+=vel*dt;

// контент
const title=document.getElementById(&#x27;title&#x27;), s1=document.getElementById(&#x27;sub1&#x27;), s2=document.getElementById(&#x27;sub2&#x27;), btns=document.getElementById(&#x27;btns&#x27;), ill=document.getElementById(&#x27;ill&#x27;);
const E=&#x27;cubic-bezier(.22,1,.36,1)&#x27;;

function setContent(i,first){const s=SLIDES[i];
 if(first){title.textContent=s.title; s1.textContent=s.s1; s2.textContent=s.s2; ill.innerHTML=&#x27;&lt;img src=&quot;&#x27;+IMG[s.img]+&#x27;&quot; alt=&quot;&quot;&gt;&#x27;; return;}

 const old=ill.querySelector(&#x27;img&#x27;); const im=new Image(); const ink=s.img===&quot;conv&quot;?2.8:s.img===&quot;plastic&quot;?1.25:1.7; im.src=IMG[s.img]; im.alt=&#x27;&#x27;; ill.appendChild(im);
 if(reduce){old&amp;&amp;old.remove();return;}
 im.animate([{opacity:0,transform:&#x27;scale(.97)&#x27;,filter:&#x27;contrast(&#x27;+ink+&#x27;) blur(0)&#x27;},{opacity:1,transform:&#x27;scale(1)&#x27;,filter:&#x27;contrast(&#x27;+ink+&#x27;) blur(0)&#x27;}],{duration:700,delay:200,easing:E,fill:&#x27;both&#x27;});
 if(old){old.animate([{opacity:1},{opacity:0,transform:&#x27;scale(.98)&#x27;}],{duration:260,fill:&#x27;forwards&#x27;}).onfinish=()=&gt;old.remove();}}

let busy=false;
function goTo(i,dir){ if(busy||i===current) return; busy=true;
 let d=i-current; if(dir) d=dir; else { if(d&gt;N/2) d-=N; if(d&lt;-N/2) d+=N; }

document.getElementById(&#x27;next&#x27;).onclick=()=&gt;goTo((current+1)%N,1);
document.getElementById(&#x27;prev&#x27;).onclick=()=&gt;goTo((current-1+N)%N,-1);
addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key===&#x27;ArrowRight&#x27;)goTo((current+1)%N,1); if(e.key===&#x27;ArrowLeft&#x27;)goTo((current-1+N)%N,-1);});

// автосмена раз в 7 секунд, пауза при наведении
let timer=null, hover=false; const stage=document.getElementById(&#x27;stage&#x27;);

stage.addEventListener(&#x27;mouseenter&#x27;,()=&gt;hover=true); stage.addEventListener(&#x27;mouseleave&#x27;,()=&gt;{hover=false;restartAuto();});

function fit(){const s=Math.min(1,innerWidth/1440); stage.style.transform=&#x27;scale(&#x27;+s+&#x27;)&#x27;; document.body.style.height=(1000*s)+&#x27;px&#x27;;}

<script>
const browser=document.querySelector('.browser'), viewport=document.querySelector('.viewport'), frame=document.querySelector('iframe'), full=document.querySelector('#fullscreen');
const original=frame.srcdoc;
function fit(){
 const availableWidth=browser.clientWidth-16;
 const availableHeight=document.fullscreenElement?browser.clientHeight-60:innerHeight-browser.getBoundingClientRect().top-80;
 const scale=Math.min(availableWidth/1440,Math.max(260,availableHeight)/1000,1);

}
new ResizeObserver(fit).observe(document.querySelector('.wrap'),{box:'border-box'});
window.addEventListener('resize',fit);
document.querySelector('#replay').onclick=()=>{frame.srcdoc=original;};
full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await browser.requestFullscreen();}catch{document.querySelector('.status').textContent='Fullscreen is unavailable in this viewer.';}};
