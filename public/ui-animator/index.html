 el.animate([{transform:&#x27;translateY(0)&#x27;,opacity:1},{transform:&#x27;translateY(-40%)&#x27;,opacity:0}],{duration:220,easing:&#x27;ease-in&#x27;,fill:&#x27;forwards&#x27;}).onfinish=()=&gt;{el.textContent=text; el.animate([{transform:&#x27;translateY(105%)&#x27;,opacity:0},{transform:&#x27;translateY(0)&#x27;,opacity:1}],{duration:560,delay:delay,easing:E,fill:&#x27;forwards&#x27;});};}
function setContent(i,first){const s=SLIDES[i];
 if(first){title.textContent=s.title; s1.textContent=s.s1; s2.textContent=s.s2; ill.innerHTML=&#x27;&lt;img src=&quot;&#x27;+IMG[s.img]+&#x27;&quot; alt=&quot;&quot;&gt;&#x27;; return;}
 swapLine(title,s.title,0); swapLine(s1,s.s1,80); swapLine(s2,s.s2,140);
 const old=ill.querySelector(&#x27;img&#x27;); const im=new Image(); const ink=i===3?2.3:1.7; im.src=IMG[s.img]; im.alt=&#x27;&#x27;; ill.appendChild(im);
 if(reduce){old&amp;&amp;old.remove();return;}
 im.animate([{opacity:0,transform:&#x27;scale(.97)&#x27;,filter:&#x27;contrast(&#x27;+ink+&#x27;) blur(4px)&#x27;},{opacity:1,transform:&#x27;scale(1)&#x27;,filter:&#x27;contrast(&#x27;+ink+&#x27;) blur(0)&#x27;}],{duration:700,delay:200,easing:E,fill:&#x27;both&#x27;});
 if(old){old.animate([{opacity:1},{opacity:0,transform:&#x27;scale(.98)&#x27;}],{duration:260,fill:&#x27;forwards&#x27;}).onfinish=()=&gt;old.remove();}}

let busy=false;
function goTo(i,dir){ if(busy||i===current) return; busy=true;
 let d=i-current; if(dir) d=dir; else { if(d&gt;N/2) d-=N; if(d&lt;-N/2) d+=N; }
 target=target+d; current=((i%N)+N)%N; kick(); setContent(current,false); setTimeout(()=&gt;busy=false,750); restartAuto();}
document.getElementById(&#x27;next&#x27;).onclick=()=&gt;goTo((current+1)%N,1);
document.getElementById(&#x27;prev&#x27;).onclick=()=&gt;goTo((current-1+N)%N,-1);
addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key===&#x27;ArrowRight&#x27;)goTo((current+1)%N,1); if(e.key===&#x27;ArrowLeft&#x27;)goTo((current-1+N)%N,-1);});

// автосмена раз в 7 секунд, пауза при наведении
let timer=null, hover=false; const stage=document.getElementById(&#x27;stage&#x27;);
function restartAuto(){clearTimeout(timer); timer=setTimeout(()=&gt;{if(!hover&amp;&amp;!document.hidden) goTo((current+1)%N,1); else restartAuto();},7000);}
stage.addEventListener(&#x27;mouseenter&#x27;,()=&gt;hover=true); stage.addEventListener(&#x27;mouseleave&#x27;,()=&gt;{hover=false;restartAuto();});

// вписать 1440 в окно
function fit(){const s=Math.min(1,innerWidth/1440); stage.style.transform=&#x27;scale(&#x27;+s+&#x27;)&#x27;; document.body.style.height=(1000*s)+&#x27;px&#x27;;}
addEventListener(&#x27;resize&#x27;,fit); fit();

setContent(0,true); render(); restartAuto(); setTimeout(()=&gt;{const h=document.querySelector(&#x27;.hint&#x27;); if(h) h.style.opacity=0;},6000);

<script>
const browser=document.querySelector('.browser'), viewport=document.querySelector('.viewport'), frame=document.querySelector('iframe'), full=document.querySelector('#fullscreen');
const original=frame.srcdoc;
function fit(){
 const availableWidth=browser.clientWidth-16;
 const availableHeight=document.fullscreenElement?browser.clientHeight-60:innerHeight-browser.getBoundingClientRect().top-80;
 const scale=Math.min(availableWidth/1440,Math.max(260,availableHeight)/1000,1);
 viewport.style.width=1440*scale+'px'; viewport.style.height=1000*scale+'px';frame.style.transform='scale('+scale+')';
}
new ResizeObserver(fit).observe(document.querySelector('.wrap'),{box:'border-box'});
window.addEventListener('resize',fit);
document.querySelector('#replay').onclick=()=>{frame.srcdoc=original;};
full.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await browser.requestFullscreen();}catch{document.querySelector('.status').textContent='Fullscreen is unavailable in this viewer.';}};
document.addEventListener('fullscreenchange',()=>{const active=Boolean(document.fullscreenElement);full.setAttribute('aria-pressed',active);full.title=active?'Exit fullscreen':'Fullscreen';full.setAttribute('aria-label',full.title);fit();});
fit();
</script>
